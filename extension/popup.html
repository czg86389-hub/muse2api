<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{
    width:420px;margin:0;padding:16px 18px 18px;
    background:#0d1117;color:#e6edf3;
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
         "Microsoft YaHei",sans-serif;
  }
  h1{font-size:15px;margin:0 0 3px;display:flex;align-items:center;gap:7px}
  h1 .dot{width:8px;height:8px;border-radius:50%;background:#4f8cff}
  .sub{color:#8b949e;font-size:11.5px;margin:0 0 12px}
  label{display:block;font-size:11.5px;color:#8b949e;margin:12px 0 4px}
  textarea{
    width:100%;min-height:92px;padding:8px 10px;border-radius:7px;resize:vertical;
    border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:11.5px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.5;
  }
  textarea:focus{outline:none;border-color:#4f8cff}
  .row{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;padding:10px;border:0;border-radius:8px;
    background:linear-gradient(180deg,#4f8cff,#3d7bf0);color:#fff;
    font-size:13px;font-weight:600;cursor:pointer;
  }
  button.ghost{background:#21262d;color:#e6edf3;border:1px solid #30363d}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.55;cursor:default;filter:none}
  .item{
    display:flex;justify-content:space-between;gap:10px;align-items:center;
    padding:7px 10px;border:1px solid #30363d;border-radius:7px;margin-top:6px;
    background:#161b22;font-size:12px;
  }
  .item b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:600}
  .ok{color:#3fb950}.bad{color:#f85149}.opt{color:#8b949e}
  .warnbox{
    margin-top:10px;padding:8px 10px;border-radius:8px;
    background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.45);
    color:#d29922;font-size:12px;white-space:pre-wrap;
  }
  #log{margin-top:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;display:none}
  #log.show{display:block}
  .foot{margin-top:12px;padding-top:10px;border-top:1px solid #21262d;
    font-size:11px;color:#6e7681;line-height:1.7}
  code{background:#161b22;padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
  <h1><span class="dot"></span>Muse2API Cookie</h1>
  <p class="sub">在当前窗口的 muse.ai 页面请求会话接口，补发 hatch_vml，再读取必填 Cookie。复制后粘到管理页「Cookie 字符串」。</p>

  <div id="list"></div>
  <div id="missing" class="warnbox" hidden></div>

  <label>可粘贴的 Cookie</label>
  <textarea id="cookieText" readonly spellcheck="false" placeholder="登录 muse.ai 后点「重新读取」"></textarea>
  <div class="row">
    <button id="renew">刷新会话</button>
    <button id="refresh" class="ghost">重新读取</button>
  </div>
  <div class="row">
    <button id="copy" disabled>复制</button>
  </div>
  <div id="log"></div>

  <div class="foot">
    必填：<code>hatch_sess</code>、<code>hatch_vml</code>、<code>hatch_native_auth_device</code>。
    <code>hatch_gw</code> 现在经常不下发，缺了不影响。
    聊天页还开着时 <code>hatch_vml</code> 也可能已经过期，点「刷新会话」会在这个窗口里重新请求。
    Cookie 只留在这个弹窗里，点复制才会进剪贴板。
  </div>

  <script src="popup.js"></script>
</body>
</html>
