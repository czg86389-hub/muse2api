# ==========================================
# MUSE2API Nginx 反向代理配置示例
# ==========================================
# 适用于宝塔面板 / 1Panel / 独立 Nginx
# 核心重点：调大 proxy_read_timeout，关闭 proxy_buffering 保证 SSE 流式输出
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # 替换为你自己的域名或 IP

    # 允许上传参考图（图生图 / 图像编辑支持多模态大图）
    client_max_body_size 200M;   # 视频/音频参考素材单个最大 40 MiB，JSON Base64 会再膨胀约 1/3

    location / {
        proxy_pass http://127.0.0.1:18610;

        # 核心：生图与生视频需要 30~120 秒，默认 60s 会导致 Nginx 报 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # 核心：关闭缓冲，保证 /v1/chat/completions 的 SSE 流式打字机 0 延迟吐字
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 兼容
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
